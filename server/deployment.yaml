apiVersion: apps/v1
kind: Deployment
metadata:
  name: object-detection
  namespace: kubeedge
  labels:
    app: object-detection
spec:
  replicas: 1
  selector:
    matchLabels:
      app: object-detection
  template:
    metadata:
      labels:
        app: object-detection
    spec:
      nodeSelector:
        node-role.kubernetes.io/edge: ""  
      containers:
        - name: object-detection
          image: preethu25/objectdetection:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 51821
          livenessProbe:
            httpGet:
              path: /health
              port: 51821
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 51821
            initialDelaySeconds: 20
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: object-detection
  namespace: kubeedge
spec:
  type: ClusterIP
  selector:
    app: object-detection
  ports:
    - protocol: TCP
      port: 51821
      targetPort: 51821
